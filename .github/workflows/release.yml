name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:packages
      - run: bun run check
      - run: bun run test
      - run: bun publish --dry-run --access public --tag next
      # Before the action, deliberately. The action runs `changeset version` in
      # this workspace, so after it package.json holds the *next* version — the
      # one whose PR has not been merged. Publishing that would make version PRs
      # decoration and release code nobody merged. Here, the workspace is still
      # exactly main.
      #
      # This runs unconditionally because the action publishes nothing when it
      # sees an unconsumed changeset: it opens a version PR instead. A version
      # PR whose branch predates the newest changeset therefore merges, bumps
      # main, and publishes nothing, stranding that version forever — which
      # happened three times in one day. Now every push converges on "npm has
      # what main has committed", and a skipped version is repaired by the next
      # push instead of being rolled over and lost.
      - name: Publish main's version if npm does not have it
        run: bash scripts/release-publish.sh
      - uses: changesets/action@v1
        with:
          version: bunx changeset version
          # The action publishes when it decides there is nothing left to
          # version; the guard below covers when it decides otherwise.
          publish: bash scripts/release-publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      # While in pre-release mode we only publish under `next`, so npm `latest`
      # goes stale and `npm i` / `bun update -g` (which follow `latest`) fetch an
      # old build. Keep `latest` pointed at the version this commit ships.
      # Skipped once pre mode is exited (pre.json gone) so a future stable
      # release owns `latest`. Idempotent + self-healing: runs every push, no-op
      # when in sync, and repairs a `latest` left behind by an earlier run.
      #
      # The target comes from package.json, not from `dist-tags.next`: the
      # registry's read path lags the publish that ran seconds earlier, so
      # querying it here once returned the pre-publish tags and skipped the
      # retag, stranding `latest` a version behind (0.1.0-next.2). The local
      # version is what we just published, so only *visibility* needs waiting on.
      - name: Track npm `latest` to the newest `next` prerelease
        if: hashFiles('.changeset/pre.json') != ''
        run: |
          set -e
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          version=$(node -p "require('./package.json').version")
          for _ in $(seq 1 30); do
            npm view "@glrs-dev/glorious@$version" version >/dev/null 2>&1 && break
            sleep 5
          done
          if ! npm view "@glrs-dev/glorious@$version" version >/dev/null 2>&1; then
            echo "version $version is not on the registry; nothing to tag"
            exit 0
          fi
          latest=$(npm view @glrs-dev/glorious dist-tags.latest 2>/dev/null || true)
          echo "version=$version latest=$latest"
          if [ "$version" != "$latest" ]; then
            npm dist-tag add "@glrs-dev/glorious@$version" latest
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
